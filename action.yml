name: 'KitOps Kitfile Generator'
description: 'Scans a repo, generates a Kitfile with kit init, validates it with kit pack, and opens a PR'
author: 'kitops.ml'

# Add your action's branding here. This will appear on the GitHub Marketplace.
branding:
  icon: 'terminal'
  color: 'green'

inputs:
  kit-version:
    description: 'Kit CLI version to install'
    required: false
    default: 'latest'
  pack-tag:
    description: 'Tag to use when validating with kit pack (e.g. local/validate:latest)'
    required: false
    default: 'local/validate:latest'
  pr-branch:
    description: 'Branch name to use for the PR'
    required: false
    default: 'kitops/add-kitfile'
  github-token:
    description: 'Token used to open the PR'
    required: false
    default: ${{ github.token }}

runs:
  using: 'composite'
  steps:
    - name: Install Kit CLI
      uses: jozu-ai/gh-kit-setup@v1.0.0
      with:
        version: ${{ inputs.kit-version }}

    - name: Generate Kitfile
      shell: bash
      run: kit init .

    - name: Verify Kitfile exists
      shell: bash
      run: |
        if [ ! -f Kitfile ]; then
          echo "Kitfile not generated" >&2
          exit 1
        fi

    - name: Validate by packing
      shell: bash
      run: kit pack . -t ${{ inputs.pack-tag }}

    - name: Open pull request
      uses: peter-evans/create-pull-request@v6
      with:
        token: ${{ inputs.github-token }}
        commit-message: 'chore: add Kitfile via KitOps'
        title: 'Add Kitfile (generated by KitOps)'
        body: |
          This PR was opened automatically by the [Kitfile Generator Action](https://github.com/nathan-young1/kitfile-generator-action).
          It adds a `Kitfile`, auto-generated from this repo's contents with `kit init .` and validated with `kit pack`.
        branch: ${{ inputs.pr-branch }}
        delete-branch: true
        add-paths: Kitfile